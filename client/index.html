<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ImobiBase | Sistema imobiliário completo com CRM, site e agenda</title>
    <meta data-react-helmet="true" name="description" content="Sistema completo para imobiliárias: CRM de leads, agenda de visitas, site imobiliário, imóveis, contratos, financeiro, locações, vistorias, WhatsApp e IA." />
    <meta data-react-helmet="true" property="og:title" content="ImobiBase | Sistema imobiliário completo com CRM, site e agenda" />
    <meta data-react-helmet="true" property="og:description" content="CRM imobiliário, agenda de visitas, site para imobiliária, contratos, financeiro, locações, vistorias, WhatsApp e IA em uma única plataforma." />
    <meta data-react-helmet="true" property="og:type" content="website" />
    <meta data-react-helmet="true" property="og:url" content="https://imobibase.com.br" />
    <meta data-react-helmet="true" property="og:image" content="https://imobibase.com.br/opengraph.png" />
    <meta data-react-helmet="true" property="og:locale" content="pt_BR" />
    <meta data-react-helmet="true" name="twitter:card" content="summary_large_image" />
    <meta data-react-helmet="true" name="twitter:site" content="@imobibase" />
    <meta data-react-helmet="true" name="twitter:title" content="ImobiBase | Sistema imobiliário completo" />
    <meta data-react-helmet="true" name="twitter:description" content="CRM, agenda, site imobiliário, contratos, financeiro, locações, vistorias, WhatsApp e IA." />
    <meta data-react-helmet="true" name="twitter:image" content="https://imobibase.com.br/opengraph.png" />

    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- manifest é injetado pelo vite-plugin-pwa no build -->
    <meta name="theme-color" content="#0066CC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1A2F" media="(prefers-color-scheme: dark)" />

    <!-- Preconnect to critical domains for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">

    <!-- Preload critical fonts to reduce FOUT (Flash of Unstyled Text) -->
    <!-- P3 Security: Added Subresource Integrity (SRI) for CDN resources -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" crossorigin="anonymous">
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    >

    <!-- Module prefetch is handled automatically by Vite's dynamic import optimization -->
    <!-- Lazy-loaded routes are automatically code-split and cached -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
