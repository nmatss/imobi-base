name: Deploy to Production (Vercel)

on:
  push:
    branches: [main]

  # Allow manual deployment trigger
  workflow_dispatch:

# Only allow one deployment at a time
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  pre-deploy:
    name: Pre-Deploy Checks (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run check

      - name: Lint
        run: npm run lint

      # better-sqlite3 não cria o diretório do banco (SQLITE_CANTOPEN em
      # checkout limpo) e os testes de integração clonam o schema do db de dev
      # (data/imobibase.db) — o push cria esse db com o schema atual.
      - name: Prepare SQLite database
        run: |
          mkdir -p data
          npm run db:push:sqlite

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pre-deploy
    environment:
      name: production
      url: https://imobibase.com.br

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NODE_ENV: production

      - name: Verify cron manifest
        run: npm run ops:cron:verify

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: $DEPLOY_URL"

      - name: Database migration policy
        run: |
          echo "Automatic production migrations are disabled by policy."
          echo "Apply reviewed migrations before deploy, one file at a time, following docs/DEPLOYMENT_RUNBOOK.md."

      - name: Notify Sentry of Deployment
        if: always()
        run: |
          curl -X POST "https://sentry.io/api/0/organizations/${{ secrets.SENTRY_ORG }}/releases/" \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "version": "${{ github.sha }}",
              "projects": ["imobibase"],
              "refs": [{
                "repository": "${{ github.repository }}",
                "commit": "${{ github.sha }}"
              }]
            }' || echo "⚠️  Sentry notification failed (non-blocking)"

      - name: Health Check
        run: |
          echo "Waiting 10s for deployment to stabilize..."
          sleep 10

          HEALTH_URL="${{ steps.deploy.outputs.DEPLOY_URL }}/api/health"
          echo "Checking health at: $HEALTH_URL"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Health check passed! (HTTP $HTTP_STATUS)"
          else
            echo "❌ Health check failed! (HTTP $HTTP_STATUS)"
            echo "::error::Production deployment is not healthy!"
            exit 1
          fi

      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              payload: {
                web_url: '${{ steps.deploy.outputs.DEPLOY_URL }}'
              },
              production_environment: true
            });

      - name: Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.deploy.outputs.DEPLOY_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::❌ Production deployment failed!"
          echo "Please check the logs above for details."
          echo "Rollback may be required if the site is down."

  # Verificação pós-deploy honesta: health check real contra o domínio canônico
  # de produção, com retry. (O antigo `npm run test:smoke` apontava para
  # tests/smoke, que o vitest.config EXCLUI — nunca rodou nada.)
  smoke-tests:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10

    steps:
      - name: Health check production (with retry)
        run: |
          URL="https://imobibase.com.br/api/health"
          for i in $(seq 1 10); do
            echo "Attempt $i/10: $URL"
            if curl -fsS --max-time 15 "$URL"; then
              echo ""
              echo "✅ Production health check passed!"
              exit 0
            fi
            echo "Health check not ready yet, retrying in 15s..."
            sleep 15
          done
          echo "::error::❌ Production health check failed after 10 attempts!"
          echo "Consider rollback if the site is down."
          exit 1
